<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hors ligne — Portail employé</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #F7F8FA;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif;
    color: #1C2438;
    padding: 24px;
  }
  .card { max-width: 360px; text-align: center; }
  .badge {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    background: #2F6F5E;
    color: #fff;
    font-weight: 700;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
  }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { font-size: 14px; color: #5B6478; margin: 0 0 20px; line-height: 1.5; }
  button {
    border: 1px solid #E2E4E9;
    background: #fff;
    color: #1C2438;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { background: #F5F6F8; }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">PE</div>
    <h1>Pas de connexion internet</h1>
    <p>Le portail employé a besoin d'internet pour afficher tes données. Reconnecte-toi puis réessaie.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
