<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logos Mindmate</title>
<style>
  :root { --navy:#1C2438; --green:#2F6F5E; --green2:#3D8C76; --bg:#F5F6F8; --card:#fff; --text:#1C2438; --muted:#6B7385; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); padding:24px 16px 48px; }
  h1 { font-size:22px; margin:0 0 4px; }
  p.sub { margin:0 0 24px; color:var(--muted); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; max-width:1100px; }
  .card { background:var(--card); border-radius:16px; padding:20px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .row { display:flex; align-items:center; gap:14px; margin-bottom:16px; }
  .tile { width:72px; height:72px; border-radius:18px; display:flex; align-items:center; justify-content:center; flex:none; }
  .tile.navy { background:var(--navy); }
  .tile.green { background:linear-gradient(135deg,var(--green2),#265A4C); }
  .tile.light { background:#fff; border:1px solid #E3E6EC; }
  .tile svg { width:48px; height:48px; }
  .mark { display:flex; align-items:center; gap:10px; padding:12px 14px; background:#FAFBFC; border-radius:12px; }
  .mark svg { width:34px; height:34px; }
  .mark b { font-size:18px; letter-spacing:-.2px; }
  .mark b span { color:var(--green); }
  h2 { font-size:16px; margin:16px 0 4px; }
  .num { color:var(--green); }
  .card p { margin:0; color:var(--muted); font-size:14px; line-height:1.45; }
  .tag { display:inline-block; margin-top:10px; font-size:12px; font-weight:600; color:var(--green); background:#E7F2EE; padding:3px 8px; border-radius:99px; }
</style>
</head>
<body>
<h1>Mindmate Compagny : 6 idées de logo</h1>
<p class="sub">Chaque logo est montré en icône d'app (fond marine, vert, blanc) et avec le nom de l'application.</p>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- 1 Duo -->
    <g id="l1" fill="none" stroke-width="9" stroke-linecap="round">
      <path d="M20 80 V60 a16 16 0 0 1 32 0 V80" />
      <path d="M48 80 V60 a16 16 0 0 1 32 0 V80" />
      <circle cx="36" cy="27" r="9" stroke="none" fill="currentColor"/>
      <circle cx="64" cy="27" r="9" stroke="none" fill="currentColor"/>
    </g>
    <!-- 2 Portail -->
    <g id="l2" fill="none" stroke-width="9" stroke-linecap="round">
      <path d="M26 84 V46 a24 24 0 0 1 48 0 V84" />
      <circle cx="50" cy="50" r="8" stroke="none" fill="currentColor"/>
      <path d="M37 84 a13 13 0 0 1 26 0" />
    </g>
    <!-- 3 Pousse -->
    <g id="l3" stroke="none" fill="currentColor">
      <path d="M48 84 C26 80 14 58 20 32 C40 40 50 60 48 84 Z" />
      <path d="M52 84 C74 80 86 58 80 32 C60 40 50 60 52 84 Z" opacity=".75"/>
      <circle cx="50" cy="20" r="9"/>
    </g>
    <!-- 4 Équipe -->
    <g id="l4" fill="none" stroke-width="8" stroke-linecap="round">
      <path d="M30 34 A28 28 0 0 1 70 34" />
      <path d="M78 52 A28 28 0 0 1 58 78" />
      <path d="M42 78 A28 28 0 0 1 22 52" />
      <circle cx="50" cy="20" r="8" stroke="none" fill="currentColor"/>
      <circle cx="80" cy="70" r="8" stroke="none" fill="currentColor"/>
      <circle cx="20" cy="70" r="8" stroke="none" fill="currentColor"/>
    </g>
    <!-- 5 Bulle -->
    <g id="l5" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M30 18 H70 a14 14 0 0 1 14 14 V58 a14 14 0 0 1 -14 14 H44 L28 84 V72 a14 14 0 0 1 -12 -14 V32 a14 14 0 0 1 14 -14 Z" />
      <path d="M36 46 L46 56 L65 36" />
    </g>
    <!-- 6 Lien -->
    <g id="l6" fill="none" stroke-width="9" stroke-linecap="round">
      <circle cx="38" cy="50" r="20" />
      <circle cx="62" cy="50" r="20" />
    </g>
  </defs>
</svg>

<div class="grid" id="grid"></div>

<script>
const items = [
  ["l1","Duo","Deux personnes côte à côte dont les épaules forment un « M ». Parle de Mindmate (« mate » = collègue) et reste lisible en tout petit.","Mon préféré"],
  ["l2","Portail","Une porte en arche avec une personne qui entre : c'est littéralement un « portail employé ». Simple, rassurant, très lisible.","Très bon choix"],
  ["l3","Pousse","Une personne dont le corps est fait de deux feuilles : bien-être et croissance des employés. Plus doux, plus « humain ».",""],
  ["l4","Équipe","Trois personnes reliées en cercle : l'équipe, l'entraide, la communication entre employés et gérants.",""],
  ["l5","Bulle validée","Une bulle de message avec un crochet : demandes envoyées et approuvées. Très lié aux fonctions de l'app, moins à la marque.",""],
  ["l6","Lien","Deux anneaux qui se croisent : l'employé et l'entreprise connectés. Ultra minimaliste, mais plus générique.",""],
];
const svg = (id, color, stroke) =>
  `<svg viewBox="0 0 100 100" style="color:${color};stroke:${stroke||color}"><use href="#${id}"/></svg>`;
document.getElementById("grid").innerHTML = items.map(([id,name,desc,tag],i)=>`
  <div class="card">
    <div class="row">
      <div class="tile navy">${svg(id,"#fff")}</div>
      <div class="tile green">${svg(id,"#fff")}</div>
      <div class="tile light">${svg(id,"#2F6F5E")}</div>
    </div>
    <div class="mark">${svg(id,"#2F6F5E")}<b>Mindmate <span>Compagny</span></b></div>
    <h2><span class="num">${i+1}.</span> ${name}</h2>
    <p>${desc}</p>
    ${tag?`<span class="tag">${tag}</span>`:""}
  </div>`).join("");
</script>
</body>
</html>
